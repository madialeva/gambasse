name: ci-linux

on:
  pull_request:
  push:
    branches:
      - 'develop/**'
      - 'release/**'

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    # GCC built from the GNU sources with the options scripts/build-gcc.sh uses
    # locally: the same compiler on both sides.
    container: gcc:16.2.0-trixie
    env:
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The checkout belongs to the runner's user, not to the container's root:
      # git refuses it unless it is trusted.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check branch name matches project version
        if: github.event_name == 'push'
        run: sh scripts/check-branch-version.sh "${GITHUB_REF_NAME}"

      # The version of scripts/build-gcc.sh, so that the local compiler and this
      # image cannot drift apart.
      - name: Check the compiler against scripts/build-gcc.sh
        run: |
          expected="$(sed -n 's/^GCC_VERSION=.*:-\([0-9.]*\)}.*/\1/p' scripts/build-gcc.sh)"
          actual="$(g++ -dumpfullversion)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::The image has GCC $actual, but scripts/build-gcc.sh installs GCC $expected:" \
                 "change the image tag and the script together"
            exit 1
          fi
          echo "GCC $actual, as scripts/build-gcc.sh"

      # Build tools, Python for aqtinstall, and the libraries Qt takes from the
      # system to build and to run the tests offscreen.
      - name: Install the system packages
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            cmake ninja-build python3-venv \
            libgl-dev libegl-dev libxkbcommon-dev libfontconfig1 libfreetype6 \
            libglib2.0-0t64 libdbus-1-3

      # The presets look for GCC where scripts/build-gcc.sh installs it; the
      # image has it in /usr/local.
      - name: Link the image's GCC where the presets look for it
        run: |
          mkdir -p ~/software
          ln -sfn /usr/local ~/software/gcc-16.2.0

      # Qt in ~/software/Qt, where the presets look for it. Saved right after
      # installing, so that a run with failing tests keeps it.
      - name: Restore Qt
        id: qt
        uses: actions/cache/restore@v4
        with:
          path: ~/software/Qt
          key: qt-6.12.0-trixie-${{ hashFiles('scripts/setup-qt.sh') }}

      - name: Install Qt
        if: steps.qt.outputs.cache-hit != 'true'
        run: scripts/setup-qt.sh

      - name: Save Qt
        if: steps.qt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/software/Qt
          key: ${{ steps.qt.outputs.cache-primary-key }}

      - name: Configure
        run: cmake --preset native

      - name: Build
        run: cmake --build --preset native

      # The lint target knows the module's C++ types and import paths; it
      # succeeds even with warnings, so the step looks for them.
      - name: Lint QML
        run: |
          cmake --build --preset native --target all_qmllint 2>&1 | tee qmllint.log
          if grep -q 'Warning:' qmllint.log; then
            echo "::error::qmllint reported warnings"
            exit 1
          fi
          for f in $(find qml -name '*.qml'); do
            ~/software/Qt/6.12.0/gcc_64/bin/qmlformat "$f" | diff -u "$f" -
          done

      - name: Test
        run: ctest --preset native

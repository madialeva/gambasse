name: ci-linux

on:
  pull_request:
  push:
    branches:
      - 'develop/**'
      - 'release/**'

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    # GCC built from the GNU sources with the options of toolchain-cpp's gcc
    # component, which builds it locally: the same compiler on both sides.
    container: gcc:16.2.0-trixie
    env:
      QT_QPA_PLATFORM: offscreen
      # The version of toolchain-cpp gambasse pins, and the components of the
      # native build (gcc comes from the image, linked below).
      TOOLCHAIN_CPP_REF: v0.2.0
      TOOLCHAIN_CPP_COMPONENTS: qt
    # gambasse and toolchain-cpp are checked out side by side, as in local work:
    # the presets name the toolchain from gambasse's parent directory.
    defaults:
      run:
        shell: bash
        working-directory: gambasse
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: gambasse

      # The toolchain at the version gambasse pins.
      - name: Checkout toolchain-cpp
        uses: actions/checkout@v4
        with:
          repository: madialeva/toolchain-cpp
          ref: ${{ env.TOOLCHAIN_CPP_REF }}
          path: toolchain-cpp

      # The checkout belongs to the runner's user, not to the container's root:
      # git refuses it unless it is trusted.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE/gambasse"

      - name: Check branch name matches project version
        if: github.event_name == 'push'
        run: sh scripts/check-branch-version.sh "${GITHUB_REF_NAME}"

      # The GCC of the pinned toolchain-cpp, so that the local compiler and this
      # image cannot drift apart.
      - name: Check the compiler against toolchain-cpp
        run: |
          source ../toolchain-cpp/versions.sh
          actual="$(g++ -dumpfullversion)"
          if [[ "$actual" != "$GCC_VERSION" ]]; then
            echo "::error::The image has GCC $actual, but toolchain-cpp $TOOLCHAIN_CPP_REF has GCC" \
                 "$GCC_VERSION: change the image tag and TOOLCHAIN_CPP_REF together"
            exit 1
          fi
          echo "GCC $actual, as toolchain-cpp $TOOLCHAIN_CPP_REF"

      # Build tools, Python for aqtinstall, and the libraries Qt takes from the
      # system to build and to run the tests offscreen.
      - name: Install the system packages
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            cmake ninja-build python3-venv \
            libgl-dev libegl-dev libxkbcommon-dev libfontconfig1 libfreetype6 \
            libglib2.0-0t64 libdbus-1-3

      # The image has GCC in /usr/local: toolchain-cpp's gcc component takes a
      # link to it as installed, so nothing builds GCC here. The link stays out
      # of the cache.
      - name: Link the image's GCC as toolchain-cpp's native compiler
        run: |
          source ../toolchain-cpp/versions.sh
          mkdir -p ../toolchain-cpp/software
          ln -sfn /usr/local "../toolchain-cpp/software/gcc-$GCC_VERSION"

      # Qt in toolchain-cpp/software, where the presets look for it. Saved right
      # after installing, so that a run with failing tests keeps it.
      - name: Restore the toolchain
        id: toolchain
        uses: actions/cache/restore@v4
        with:
          path: |
            toolchain-cpp/software
            !toolchain-cpp/software/gcc-*
          key: toolchain-cpp-${{ env.TOOLCHAIN_CPP_REF }}-gcc-16.2.0-trixie-${{ env.TOOLCHAIN_CPP_COMPONENTS }}

      # The downloads and aqt's environment only serve to install: out of the cache.
      - name: Install the toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          ../toolchain-cpp/install.sh $TOOLCHAIN_CPP_COMPONENTS
          rm -rf ../toolchain-cpp/software/src ../toolchain-cpp/software/aqt-venv \
            ../toolchain-cpp/software/aqtinstall.log

      - name: Save the toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            toolchain-cpp/software
            !toolchain-cpp/software/gcc-*
          key: ${{ steps.toolchain.outputs.cache-primary-key }}

      - name: Configure
        run: cmake --preset native

      - name: Build
        run: cmake --build --preset native

      # The lint target knows the module's C++ types and import paths; it
      # succeeds even with warnings, so the step looks for them.
      - name: Lint QML
        run: |
          cmake --build --preset native --target all_qmllint 2>&1 | tee qmllint.log
          if grep -q 'Warning:' qmllint.log; then
            echo "::error::qmllint reported warnings"
            exit 1
          fi
          for f in $(find qml -name '*.qml'); do
            ../toolchain-cpp/software/Qt/6.12.0/gcc_64/bin/qmlformat "$f" | diff -u "$f" -
          done

      - name: Test
        run: ctest --preset native
